services:
  postgres:
    image: postgres:16
    container_name: leadsMCP
    environment:
      POSTGRES_PASSWORD: Senhaultrasecreta123
      POSTGRES_DB: LeadsDb
    ports:
      - "5432:5432"
    volumes:
      - postgres-leads-mcp:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: leadsRabbitMQ
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-leads-mcp:/var/lib/rabbitmq

volumes:
  postgres-leads-mcp:
  rabbitmq-leads-mcp:
